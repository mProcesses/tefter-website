# Home page / Početna strana
home:
  title: "Početna"
  description: "Transakcije ne “pucaju” — one se pauziraju, biznis ih ispravi i nastave. Tefter održava B2B trgovinu u pokretu kroz nepoklapanja i prekide."
  main_heading: "Transakcije ne “pucaju”. One se pauziraju, biznis ih ispravi i nastave."
  main_subheading: "Porudžbine, fakture i otpremnice prolaze kroz nepoklapanja podataka i prekide — bez IT tiketa."
  
  new_category_title: "Nova kategorija: Platforma operativnog kontinuiteta"
  new_category_desc: "Tradicionalne integracije prenose podatke između sistema. ERP vodi interne tokove rada. <strong>Tefter je između kao sistem kontinuiteta za B2B trgovinu</strong> — transakcije ostaju žive kada je realnost neuredna. Kada nešto “pukne”, biznis odobri ispravku uz audit trag, a transakcija se automatski nastavi (bez ponovnog unosa, bez dupliranja, bez IT backloga)."
  
  problem_title: "Problem Koji Rešavamo"
  problem_headline: "EDI radi — dok se nešto ne promeni."
  problem_subheadline: "99% koje prođe je nevidljivo. U 1% koje pukne krije se pravi trošak."
  problem_reality_intro: "Partner promeni format. Mreža padne. Šifra artikla se ne poklapa. Šta onda?"
  
  problem_time_title: "Vreme"
  problem_time_desc: "Nedeljama čekaš IT. Svaka popravka zahteva specijaliste koji nisu dostupni sad."
  
  problem_cost_title: "Trošak"
  problem_cost_desc: "Skupi konsultanti koji naplaćuju po satu. Cena po incidentu koja brzo raste."
  
  problem_revenue_title: "Prihod"
  problem_revenue_desc: "Porudžbine blokirane. Isporuke kasne. Kupci koji ne mogu da čekaju odlaze."
  
  problem_ops_title: "Operacije"
  problem_ops_desc: "Ručna zaobilaženja. Ponovno unošenje podataka. Greške koje se gomilaju. Timovi gase požare umesto da rade."
  
  problem_current_approaches: "Kako firme danas pokušavaju da reše ovaj problem:"
  
  path_erp_title: "Sve preko ERP-a"
  path_erp_desc: "Koristiš ERP i za operacije i za povezivanje sa partnerima."
  path_erp_reality: "Komplikovano i skupo, IT je uvek u središtu za svaku izmenu, uključivanje partnera postaje projekat (nedelje, ne sati), kruti zahtevi, a oporavak kada razmena pukne je ručan i nevidljiv."
  
  path_edi_title: "EDI Usluga"
  path_edi_desc: "Kupuješ EDI/integracionu uslugu za povezivanje partnera, a operacije vodiš u drugim sistemima."
  path_edi_reality: "Prenosi formate, ali ne daje kontinuitet — mapiranja i izuzetci i dalje zavise od specijalista, skupo je po partneru, poslovni korisnici ne mogu brzo da reše probleme, a uključivanje partnera i dalje traje nedeljama."
  
  path_custom_title: "Sopstvene Integracije"
  path_custom_desc: "Praviš svoj middleware i integracije između sistema."
  path_custom_reality: "Visoki troškovi razvoja i održavanja, krhke veze koje često pucaju, neujednačeni standardi, treba ti posvećen tim, a svaki novi partner postaje poseban projekat."
  
  path_manual_title: "Ručno"
  path_manual_desc: "Telefon, email, tabele i ručan unos podataka."
  path_manual_reality: "Ne može da se skalira, puno grešaka, nema jasne vidljivosti ni vlasništva, a oporavak je u potpunosti ručan — što vodi ka kašnjenjima i sporovima."

  problem_gap: "<strong>Praznina:</strong> kada transakcija pukne, IT “poseduje realnost” — a operativa čeka."
  problem_solution: "<strong>Šta ti treba:</strong> sistem u kome transakcije ostaju žive i u kome biznis može da ispravi realnost dok transakcija traje."
  register: "Registruj se"
  contact_sales: "Kontaktiraj prodaju"
  
  business_fix_title: "Biznis ispravlja realnost — dok transakcija traje"
  business_fix_intro: "Kada partner pošalje “Proizvod A / pakovanje 24”, a tvoj sistem očekuje “PA-24”, većina platformi padne i napravi IT tiket. Tefter pauzira transakciju, pošalje je pravom poslovnom vlasniku, sačuva odobrenu odluku kao govern-ovano pravilo, zatim ponovi (replay) i završi automatski."
  business_fix_step1_title: "Detektuj nepoklapanje / drift"
  business_fix_step1_desc: "TX označi šta nije u redu i drži transakciju živom umesto da je “fail”-uje."
  business_fix_step2_title: "Odobri poslovnu odluku"
  business_fix_step2_desc: "Operativa odobri korekciju uz RBAC i potpun audit trag."
  business_fix_step3_title: "Replay i čist nastavak"
  business_fix_step3_desc: "TX nastavlja sa tačnog mesta — bez dupliranja, bez ručnog ponovnog unosa."
  business_fix_closing: "Ovo je pomak kategorije: oporavak je poslovni workflow, ne developerski workflow."

  breakthrough_title: "Engine kontinuiteta: Tefter Exchange (TX)"
  solution_highlight: "Napravili smo <strong>Tefter Exchange (TX)</strong> — stateful engine izvršavanja za B2B transakcije. Drži porudžbine/fakture/otpremnice oporavljivim, nastavlja čisto posle prekida i šalje odluke o podacima biznisu uz potpunu sledljivost."
  
  how_works_title: "Kako Tefter Radi — Ukratko"
  
  tx_subtitle: "Tefter Exchange (TX)"
  tx_desc: "TX je engine kontinuiteta koji drži transakcije živim kroz prekide, nepoklapanja i nedostupnost partnera."
  tx_feature_1: "<strong>Oporavljivo izvršavanje:</strong> bezbedno pauzira, automatski pokušava ponovo i nastavlja bez dupliranja ili ponovnog unosa"
  tx_feature_2: "<strong>Poslovno-operativna korekcija:</strong> kada se podaci ne poklapaju, odluka ide pravoj ulozi (ne u IT red) i transakcija se ponovo odigra"
  tx_feature_3: "<strong>Realnost partnera:</strong> povezuje EDI, API, fajlove ili email — bez nametanja novog “standarda”"
  tx_feature_4: "<strong>Audit + vidljivost:</strong> vidiš stanje svake transakcije, vlasnika i sledeći korak, sa sledljivošću od početka do kraja"
  
  tx_example_title: "Primer"
  tx_example: "Stigne porudžbina sa stavkom “Proizvod A / pakovanje 24,” ali tvoj sistem očekuje “PA-24.” TX označi nepoklapanje, predloži korekciju, poslovni vlasnik odobri, TX sačuva govern-ovano pravilo i transakcija se ponovi i završi — bez IT tiketa."
  tx_start_quick: "<strong>Kreni za par minuta:</strong> registruješ organizaciju, dobiješ kredencijale i odmah kreneš sa transakcijama. Mapiranja i prosleđivanje u ERP doteruješ usput."
  tx_edi_bridge: "<strong>Kompatibilno sa EDI‑jem:</strong> TX može da stabilizuje postojeće EDI tokove ili da postepeno zameni zastarele EDI sisteme — smanjujući IT opterećenje i povećavajući operativnu pouzdanost."

  accelerate_title: "Još načina da ubrzaš"
  accelerate_intro: "TX drži transakcije živim. Operativna brzina dolazi iz onoga što možeš da uradiš dok traju."
  
  accelerate_infra_title: "Operativne površine koje tvoj tim kontroliše"
  accelerate_infra_desc: "Browser-based i bezbedne po defaultu. Ove površine omogućavaju biznisu da deluje na TX (odobrenja, izuzeci, izvršavanje) bez čekanja na IT."
  
  accelerate_ai_title: "Podrška u odlučivanju gde je bitna"
  accelerate_ai_desc: "AI može da predloži korekcije (SKU/JM, sinonimi, formatiranje), ali biznis odobrava. Tako kontinuitet ostaje govern-ovan."
  
  accelerate_closing: "Kontinuitet je proizvod. Površine i podrška u odlučivanju ga čine upotrebljivim operativi."

  tx_enables_title: "Operativne aplikacije — gotova rešenja na TX-u"
  
  ops_subtitle: "Gotova rešenja za svakodnevne poslovne operacije — samostalno ili kao nadogradnja ERP-a:"
  ops_desc: ""
  
