# Serbian translations
nav:
  contact: "Pokrenite pilot"

global:
  start_pilot: "Pokrenite pilot"
  see_how: "Kako radi"

footer:
  copyright: "© %{year} Tefter. Sva prava zadržana."

hero:
  tagline: "Tefter / AI kontrolni toranj za porudžbine"
  title: "Usklađene porudžbine koje štite prodaju i kvalitet isporuke"
  subtitle: "Tefter pomaže kupcima i dobavljačima da spreče nesporazume u porudžbinama pre nego što postanu dorade, nepotpune isporuke i izgubljena prodaja. Cilj je manje trenja i gubitaka, uz bolju zaštitu isporuke na vreme i u punoj količini (OTIF)."
  vision: "Zajednički AI kontrolni sloj za B2B trgovinu, za kompanije svih veličina, sve kanale poručivanja i svaki nivo digitalne spremnosti."

problem:
  title: "Koliko koštaju neusklađene porudžbine"
  intro: "Prodavnica poruči 12 kartona. Dobavljač evidentira 12 komada. Oba tima vide „12“ i očekuju različitu isporuku. Bez obzira na kanal, obe strane moraju da se slože oko artikla, pakovanja, količine, mesta i datuma isporuke."
  direct_title: "Direktni troškovi"
  direct_desc: "Vreme za razjašnjavanje porudžbina, ispravke u ERP-u i usklađivanje faktura. Kada isporuka krene: ponovno komisioniranje, povraćaji i druga dostava."
  indirect_title: "Ugrožena prodaja"
  indirect_desc: "Manjak u isporuci ostavlja praznu policu. Višak zaliha vezuje novac. Zakasnela isporuka propušta akciju. Ponovljeni propusti ugrožavaju OTIF i poslovni odnos."

how:
  title: "Kako radi"
  intro: "Tefter proverava svaku porudžbinu pre nego što stigne u ERP i čuva originalni zahtev, odluku i predaju na jednom mestu."
  step1_title: "Provera porudžbine"
  step1_desc: "AI povezuje šifre kupca, pakovanja, količine i mesta isporuke sa artiklima dobavljača i označava ono što nije sigurno."
  step2_title: "Dogovor na zajedničkoj porudžbini"
  step2_desc: "Osoba koja zna odgovor — kupac ili dobavljač — potvrđuje, ispravlja ili isključuje stavku. Odluka ostaje na porudžbini."
  step3_title: "Slanje dogovorene porudžbine"
  step3_desc: "Proverena porudžbina ide u ERP kroz dogovoreni interfejs. Potvrđena mapiranja se koriste i na sledećoj porudžbini."

channels:
  title: "Svi kanali, jedan proces porudžbine"
  intro: "Veličina kompanije ne treba da odredi kako porudžbina stiže — niti da li partner može da učestvuje."
  connected_title: "EDI i ERP"
  connected_desc: "Strukturirane porudžbine se mapiraju i proveravaju. Podešena pravila mogu da zadrže porudžbinu dok se ne odluči o nerešenoj stavci."
  documents_title: "Email i prilozi"
  documents_desc: "Email, Excel, PDF, skenovi i slike. AI priprema nacrt; operater ga proverava pored originala i odobrava."
  phone_title: "Mesindžer i portal"
  phone_desc: "Kupci poručuju preko WhatsApp-a, Viber-a, Telegram-a ili B2B portala. Dobavljači bez ERP-a rade u pregledaču."

evidence:
  baseline_value: "35%"
  edi_value: "99,9%"
  email_value: "97,8%"
  time_value: "~80%"
  title: "Izmereno na stvarnim porudžbinama u 2026."
  baseline: "od 3.650 porudžbina izgubilo je bar jednu stavku na jednoj EDI vezi trgovinski lanac–dobavljač, tokom 12 meseci pre Teftera."
  edi: "EDI stavki automatski povezano na jednoj vezi u oktobru, u odnosu na 93,8% u septembru."
  email: "stavki iz emaila automatski povezano (2.439 od 2.495) tokom dve nedelje. Operateri su i dalje odobravali svaku porudžbinu."
  time: "manje vremena za obradu email porudžbina u prvih pet nedelja pilota, u poređenju sa ručnim prekucavanjem."
  note: "Odvojena merenja, ne kontrolisano poređenje pre i posle. Povezivanje nije isporuka; finansijski efekat zahteva praćenje stavki do isporuke."

who:
  title: "Za obe strane porudžbine"
  suppliers_title: "Distributeri i dobavljači"
  suppliers_desc: "Proverene porudžbine direktno u vaš ERP. Tim pregleda pripremljene porudžbine umesto da ih prekucava i pita kupca kada stavka nije jasna."
  retailers_title: "Nabavka u maloprodaji"
  retailers_desc: "Vidite šta su dobavljači primili. Rešite pitanja artikla, pakovanja i količine pre otpreme, uz zapis onoga što je dogovoreno."
  erp_title: "ERP partneri"
  erp_desc: "Ponudite klijentima proveren prijem porudžbina. Vaš tim vodi ERP interfejs i odnos sa klijentom; Tefter održava prijem, mapiranja i izuzetke."

cta:
  title: "Isprobajte na svojim porudžbinama"
  desc: "Izaberite jedan tok porudžbina: jedan ERP, dva ili tri kupca ili dobavljača, jedan ili dva kanala. Donesite jednu rutinsku porudžbinu i jednu koja je zahtevala telefonski poziv. Mere dogovaramo unapred, a rezultate zajedno pregledamo."
