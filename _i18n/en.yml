# Home page
home:
  title: "Home"
  description: "Stay operational — no matter what happens. Tefter combines real-time exchange between partners with real-time apps for your teams."
  main_heading: "Stay operational — no matter what happens."
  main_subheading: "Self-healing data exchange between partners. Real-time apps for your teams."
  
  new_category_title: "A New Category: Operational Continuity Platform"
  new_category_desc: "Traditional EDI moves messages between systems. Traditional ERP runs internal workflows. <strong>Between them, Tefter Exchange (TX)</strong> — an operational continuity platform — doesn't just move data, it keeps your business moving. AI-powered Dashboard that keeps humans in control. When issues hit, your team resolves them in minutes — no IT ticket, no weeks of waiting. And when you need more than exchange, real-time Apps with functional AI agents are ready: sales, warehouse operations, procurement, and more — with or without your existing ERP."
  
  problem_title: "The Problem We Solve"
  problem_headline: "EDI works — until something changes."
  problem_subheadline: "The 99% that flows is invisible. The 1% that breaks is where the real cost hides."
  problem_reality_intro: "A partner updates their format. A network drops. A product code doesn't match. What happens next?"
  
  problem_time_title: "Time"
  problem_time_desc: "Weeks waiting in IT queues. Every fix requires specialists who aren't available now."
  
  problem_cost_title: "Cost"
  problem_cost_desc: "Expensive consultants billing by the hour. Per-incident charges that add up fast."
  
  problem_revenue_title: "Revenue"
  problem_revenue_desc: "Orders stuck in limbo. Shipments delayed. Customers who can't wait move on."
  
  problem_ops_title: "Operations"
  problem_ops_desc: "Manual workarounds. Data re-entry. Errors that cascade. Teams firefighting instead of executing."
  
  problem_current_approaches: "How companies try to manage this today:"
  
  path_erp_title: "The ERP-Centric Path"
  path_erp_desc: "Rely on your ERP for both operations and partner connections."
  path_erp_reality: "Complex and expensive, requires IT for every partner change, onboarding becomes a project (weeks, not hours), rigid requirements, and manual/opaque recovery when exchange fails."
  
  path_edi_title: "The EDI Service Path"
  path_edi_desc: "Purchase an EDI/integration service to connect partners while using separate systems for operations."
  path_edi_reality: "Moves data formats, but doesn’t deliver continuity — mappings and exceptions still depend on specialists, cost scales per partner, business users can’t resolve issues quickly, and onboarding still takes weeks."
  
  path_custom_title: "The Custom Integration Path"
  path_custom_desc: "Build your own middleware and integrations between systems."
  path_custom_reality: "High build and maintenance costs, brittle connections, inconsistent standards, a dedicated team required, and every new partner becomes a bespoke project."
  
  path_manual_title: "The Manual Process Path"
  path_manual_desc: "Rely on phone, email, spreadsheets, and manual data entry."
  path_manual_reality: "Doesn’t scale, error-prone, no clear visibility or ownership, and recovery is entirely manual — leading to delays and disputes."

  problem_gap: "<strong>The gap:</strong> recovery is always someone else's problem — until it's yours."
  problem_solution: "<strong>What you need:</strong> Tefter Exchange (TX) — a system of continuity for transactions. Recoverable execution. Automatic retry. Business-operable resolution when data doesn't match."
  register: "Register"
  contact_sales: "Contact Sales"
  
  breakthrough_title: "Exchange Layer: Tefter Exchange (TX)"
  solution_highlight: "We built <strong>Tefter Exchange (TX)</strong> — a system of continuity for business transactions. It keeps execution recoverable, resumes automatically after failures, and routes data decisions to the business with full traceability."
  
  how_works_title: "How Tefter Works — Quick Overview"
  
  tx_subtitle: "Tefter Exchange (TX)"
  tx_desc: "TX is the exchange/continuity layer that keeps transactions safe through failures and mismatches."
  tx_feature_1: "<strong>Recoverable execution:</strong> pause safely, retry automatically, and resume without re-entry or duplication"
  tx_feature_2: "<strong>Business-operable fixes:</strong> when data doesn’t match, route the decision to the right role (not an IT queue) and replay the transaction"
  tx_feature_3: "<strong>Partner reality:</strong> connect via EDI, API, files, or email — without forcing a new “standard”"
  tx_feature_4: "<strong>Audit + visibility:</strong> see every transaction state, owner, and next action with traceability end-to-end"
  
  tx_example_title: "Example"
  tx_example: "An order is sent with item “Product A / case of 24,” but the customer expects code “PA-24.” TX flags the mismatch, suggests a mapping, the business owner approves, TX stores the rule, and the transaction is replayed and completes — without an IT ticket."
  tx_start_quick: "<strong>Start in minutes:</strong> register your organization, get credentials, and begin transacting. Refine mappings and ERP forwarding as you go."
  tx_edi_bridge: "<strong>EDI-friendly:</strong> TX can stabilize existing EDI flows or gradually replace legacy EDI over time — reducing IT workload while increasing operational reliability."

  accelerate_title: "More ways to accelerate"
  accelerate_intro: "TX keeps your exchange running. But operational speed comes from more than just continuity. Two more efficiency gains are built into the platform."
  
  accelerate_infra_title: "Apps your teams own"
  accelerate_infra_desc: "Browser-based. Cloud-native. Secure by default. Your teams use Tefter Apps from any device, with no installation and no IT maintenance. IT focuses on strategy — not keeping apps running."
  
  accelerate_ai_title: "Intelligence where it matters"
  accelerate_ai_desc: "Some tasks require domain knowledge but not creativity — mapping free text to product codes, structuring marketing content, pulling business insights. Embedded AI agents handle these, so your people focus on decisions that move the business."
  
  accelerate_closing: "TX delivers continuity. Apps deliver speed. One platform, more operational capacity."

  tx_enables_title: "Operational Apps — Ready Solutions on TX"
  
  ops_subtitle: "Ready solutions for daily business operations — standalone or as ERP augmentation:"
  ops_desc: ""
  
