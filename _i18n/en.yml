footer:
  copyright: "© %{year} Tefter. All rights reserved."

hero:
  tagline: "Tefter / AI Order Control Tower"
  title: "Order alignment that helps protect sales and delivery performance"
  subtitle: "Tefter helps buyers and suppliers prevent order misunderstandings before they become rework, incomplete deliveries and lost sales. The aim is less downstream friction and loss, with stronger protection for on-time, in-full delivery (OTIF)."
  vision: "A shared AI control layer for B2B trade, across companies of every size, ordering channel and level of digital readiness."

problem:
  title: "What order misalignment costs"
  intro: "A store orders 12 cases. The supplier records 12 units. Both teams see “12” and expect a different delivery. Whatever the channel, both sides need to agree on the item, pack size, quantity, delivery location and date."
  direct_title: "Direct costs"
  direct_desc: "Time spent clarifying orders, correcting ERP entries and reconciling invoices. After fulfilment starts: repicking, returns and second deliveries."
  indirect_title: "Sales at risk"
  indirect_desc: "A short shipment leaves a shelf empty. Excess stock ties up cash. A late delivery misses a promotion. Repeated misses put OTIF and the trading relationship at risk."

how:
  title: "How it works"
  intro: "Tefter checks each order before it reaches the ERP, and keeps the original request, the decision and the handoff together."
  step1_title: "Check the order"
  step1_desc: "AI matches customer codes, pack sizes, quantities and delivery locations to the supplier’s articles and flags what is uncertain."
  step2_title: "Agree on the shared order"
  step2_desc: "The person who can answer — buyer or supplier — confirms, corrects or excludes the line. The decision stays on the order."
  step3_title: "Release the agreed order"
  step3_desc: "The checked order goes to the ERP through the agreed interface. Confirmed mappings are reused on the next order."

channels:
  title: "Every channel, one order process"
  intro: "Company size should not decide how an order arrives — or whether a partner can take part."
  connected_title: "EDI and ERP"
  connected_desc: "Structured orders are matched and checked. Configured rules can pause an order until an unresolved line is decided."
  documents_title: "Email and attachments"
  documents_desc: "Email, Excel, PDF, scans and images. AI prepares a draft; an operator reviews it beside the original and approves."
  phone_title: "Messenger and portal"
  phone_desc: "Customers order by WhatsApp, Viber, Telegram or B2B portal. Suppliers without an ERP work in the browser."

evidence:
  baseline_value: "35%"
  edi_value: "99.9%"
  email_value: "97.8%"
  time_value: "~80%"
  title: "Measured on live orders in 2026"
  baseline: "of 3,650 orders lost at least one line on one retail chain–supplier EDI connection, over 12 months before Tefter."
  edi: "of EDI lines matched automatically on one connection in October, up from 93.8% in September."
  email: "of emailed lines matched automatically (2,439 of 2,495) over two weeks. Operators still approved each order."
  time: "less email processing time reported in the first five pilot weeks, compared with manual retyping."
  note: "Separate measurements, not a controlled before-and-after comparison. Matching is not delivery; financial impact requires following lines through fulfilment."

who:
  title: "Built for both sides of the order"
  suppliers_title: "Distributors and suppliers"
  suppliers_desc: "Get checked orders into your ERP. Your team reviews prepared orders instead of retyping them, and asks the buyer when a line is unclear."
  retailers_title: "Retail purchasing"
  retailers_desc: "See what your suppliers received. Resolve product, pack and quantity questions before dispatch, with a record of what was agreed."
  erp_title: "ERP partners"
  erp_desc: "Offer checked order intake to your clients. Your team owns the ERP interface and relationship; Tefter maintains intake, mappings and exceptions."

cta:
  title: "Test it on your own orders"
  desc: "Pick one order flow: one ERP, two or three customers or suppliers, one or two channels. Bring a routine order and one that needed a phone call. We agree the measures up front and review the results together."
