  ops_warehouse_desc: "Picking, packing, shipping, route management → inventory synced automatically"
  
  ops_partner_title: "Partner Management"
  ops_partner_desc: "Monitor B2B transactions, resolve mapping exceptions, manage EDI contracts"
  
  ops_timesheets_title: "Timesheets"
  ops_timesheets_desc: "QR check-in/out, shift management, approval workflows"
  
  ops_expenses_title: "Expenses"
  ops_expenses_desc: "Capture invoices and receipts with document scanning"
  
  ops_marketing_title: "Marketing Campaigns"
  ops_marketing_desc: "AI-powered campaigns across Google, Facebook, Instagram"
  
  ops_catalog_title: "Catalog Manager"
  ops_catalog_desc: "Centralized article and category management across apps"
  
